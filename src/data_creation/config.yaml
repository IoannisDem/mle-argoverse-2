output_path: data/raw
max_steps: 1000

meta_env:
  image_observation: true

  image_on_cuda: false

  vehicle_config:
    image_source: rgb_camera

  sensors:
    rgb_camera:
      type: rgb_camera
      width: 256
      height: 256

  stack_size: 1

  agent_policy: idm_policy

  num_scenarios: 1000
  start_seed: 0
  traffic_density: 0.15
  accident_prob: 0

  log_level: 50